services:

  # ── RAG Service (Python / FastAPI) ─────────────────────────────────────────
  rag:
    build: ./rag
    container_name: ktronix_rag
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-llama-3.1-8b-instant}
    volumes:
      - ./rag/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Backend (Node.js / Express) ────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: ktronix_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-llama-3.1-8b-instant}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
      - RAG_SERVICE_URL=http://rag:8000
      - PORT=3001
    depends_on:
      rag:
        condition: service_healthy

  # ── Frontend (React + Vite → nginx) ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_HOST: backend:3001    # docker interno → nombre del servicio
    container_name: ktronix_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  # ── n8n (Orquestador visual) ───────────────────────────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: ktronix_n8n
    restart: unless-stopped
    ports:
      - "5679:5678"
    environment:
      - N8N_HOST=localhost
      - WEBHOOK_URL=http://localhost:5679/
      - GENERIC_TIMEZONE=America/Bogota
      - TZ=America/Bogota
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - backend
      - rag

volumes:
  n8n_data:
